name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform package to build"
        type: choice
        default: all
        options:
          - all
          - windows
          - linux
      release:
        description: "Create tag + GitHub release (requires target=all)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  HL2SDK_REPO: alliedmodders/hl2sdk
  HL2SDK_REF: cs2
  MMSOURCE_REPO: alliedmodders/metamod-source
  MMSOURCE_REF: master

jobs:
  # Extracts and validates the native and managed package versions
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native_version: ${{ steps.ver.outputs.native }}
      managed_version: ${{ steps.ver.outputs.managed }}
      version: ${{ steps.ver.outputs.unified }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract versions
        id: ver
        run: |
          native=$(sed -nE 's/.*GetVersion\(\) override \{ return "([^"]+)".*/\1/p' src/plugin.h | head -1)
          managed=$(sed -nE 's/.*ModuleVersion => "([^"]+)".*/\1/p' csharp/BotHiderImpl/BotHiderImplPlugin.cs | head -1)
          echo "Native=$native Managed=$managed"
          for version in "$native" "$managed"; do
            test -n "$version" || { echo "::error::failed to extract a version string"; exit 1; }
          done
          {
            echo "native=$native"
            echo "managed=$managed"
          } >> "$GITHUB_OUTPUT"
          if [ "$native" = "$managed" ]; then
            echo "unified=$native" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::version mismatch: Native=$native Managed=$managed"
            echo "unified=" >> "$GITHUB_OUTPUT"
          fi

      - name: Release preconditions
        if: inputs.release
        env:
          NATIVE: ${{ steps.ver.outputs.native }}
          MANAGED: ${{ steps.ver.outputs.managed }}
        run: |
          if [ "${{ inputs.target }}" != "all" ]; then
            echo "::error::release requires target=all (got '${{ inputs.target }}')"
            exit 1
          fi
          if [ "$NATIVE" != "$MANAGED" ]; then
            echo "::error::version mismatch, refusing to release: Native=$NATIVE Managed=$MANAGED"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$NATIVE" | grep -q .; then
            echo "::error::tag v$NATIVE already exists"
            exit 1
          fi
          echo "releasing v$NATIVE"

  # Builds the platform-independent CounterStrikeSharp files once
  csharp:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build csharp/BotHiderImpl -c Release -o build/csharp

      - name: Verify output
        run: |
          test -f build/csharp/BotHiderImpl.dll
          test -f build/csharp/BotHiderApi.dll
          test -f build/csharp/shared/0Harmony/0Harmony.dll

      - name: Upload managed files
        uses: actions/upload-artifact@v7
        with:
          name: managed-build-${{ needs.guard.outputs.managed_version }}
          path: build/csharp/
          if-no-files-found: error

  # Builds the native Windows plugin and assembles the complete package
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    needs: [guard, csharp]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Checkout hl2sdk-cs2
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HL2SDK_REPO }}
          ref: ${{ env.HL2SDK_REF }}
          path: deps/hl2sdk-cs2

      - name: Checkout metamod-source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MMSOURCE_REPO }}
          ref: ${{ env.MMSOURCE_REF }}
          path: deps/metamod-source

      - name: Install protoc 3.21.12
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-win64.zip
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc.exe" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc.exe" --version | grep -q 'libprotoc 3\.21\.12'

      - name: Configure + build
        env:
          HL2SDKCS2: ${{ github.workspace }}/deps/hl2sdk-cs2
          MMSOURCE_DEV: ${{ github.workspace }}/deps/metamod-source
          CSGO_PROTO: ${{ github.workspace }}/deps/hl2sdk-cs2/common
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -S .
          cmake --build build --config Release

      - name: Download managed files
        uses: actions/download-artifact@v8
        with:
          name: managed-build-${{ needs.guard.outputs.managed_version }}
          path: build/csharp

      - name: Stage managed files
        shell: bash
        run: |
          css=build/package/addons/counterstrikesharp
          mkdir -p "$css/plugins/BotHiderImpl" "$css/shared/BotHiderApi"
          cp build/csharp/BotHiderImpl.* "$css/plugins/BotHiderImpl/"
          cp build/csharp/BotHiderApi.* "$css/shared/BotHiderApi/"
          cp -r build/csharp/shared/. "$css/shared/"

      - name: Verify package
        shell: bash
        run: |
          test -f build/package/addons/BotHider/bin/win64/BotHider.dll
          test -f build/package/addons/counterstrikesharp/plugins/BotHiderImpl/BotHiderImpl.dll
          test -f build/package/addons/counterstrikesharp/shared/BotHiderApi/BotHiderApi.dll
          test -f build/package/addons/counterstrikesharp/shared/0Harmony/0Harmony.dll

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotHider-Windows-${{ needs.guard.outputs.native_version }}
          path: build/package/
          if-no-files-found: error

  # Builds the native Linux plugin in SteamRT3 and assembles the complete package
  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    needs: [guard, csharp]
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Checkout hl2sdk-cs2
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HL2SDK_REPO }}
          ref: ${{ env.HL2SDK_REF }}
          path: deps/hl2sdk-cs2

      - name: Checkout metamod-source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MMSOURCE_REPO }}
          ref: ${{ env.MMSOURCE_REF }}
          path: deps/metamod-source

      - name: Install protoc 3.21.12
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version | grep -q 'libprotoc 3\.21\.12'

      - name: Configure + build
        env:
          HL2SDKCS2: ${{ github.workspace }}/deps/hl2sdk-cs2
          MMSOURCE_DEV: ${{ github.workspace }}/deps/metamod-source
          CSGO_PROTO: ${{ github.workspace }}/deps/hl2sdk-cs2/common
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Download managed files
        uses: actions/download-artifact@v8
        with:
          name: managed-build-${{ needs.guard.outputs.managed_version }}
          path: build/csharp

      - name: Stage managed files
        run: |
          css=build/package/addons/counterstrikesharp
          mkdir -p "$css/plugins/BotHiderImpl" "$css/shared/BotHiderApi"
          cp build/csharp/BotHiderImpl.* "$css/plugins/BotHiderImpl/"
          cp build/csharp/BotHiderApi.* "$css/shared/BotHiderApi/"
          cp -r build/csharp/shared/. "$css/shared/"

      - name: Verify package
        run: |
          binary=build/package/addons/BotHider/bin/linuxsteamrt64/BotHider.so
          test -f "$binary"
          test -f build/package/addons/counterstrikesharp/plugins/BotHiderImpl/BotHiderImpl.dll
          test -f build/package/addons/counterstrikesharp/shared/BotHiderApi/BotHiderApi.dll
          test -f build/package/addons/counterstrikesharp/shared/0Harmony/0Harmony.dll
          max_glibc=$(readelf --version-info "$binary" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | sort -Vu \
            | tail -1)
          test -n "$max_glibc"
          if [ "$(printf '%s\n' GLIBC_2.31 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "::error::$binary requires $max_glibc, newer than SteamRT3's GLIBC_2.31"
            exit 1
          fi
          echo "$binary requires at most $max_glibc"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: BotHider-Linux-${{ needs.guard.outputs.native_version }}
          path: build/package/
          if-no-files-found: error

  # Publishes the complete Windows and Linux packages
  release:
    if: inputs.release
    needs: [guard, csharp, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: BotHider-*
          path: artifacts

      - name: Zip packages
        run: |
          cd artifacts
          for directory in */; do
            directory="${directory%/}"
            (cd "$directory" && zip -qr "../$directory.zip" .)
            echo "packed $directory.zip"
          done
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2

      - name: Create tag + release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
