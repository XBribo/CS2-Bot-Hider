name: Feature request
description: Suggest one focused improvement to the plugin
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should solve a specific problem.

        Please keep one request in each issue. Collections of unrelated ideas may be closed.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the real gameplay or usability problem before describing a solution.
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: What improvement would you like?
      description: Describe the expected behavior as simply and clearly as possible.
    validations:
      required: true

  - type: dropdown
    id: plugin-scope
    attributes:
      label: Which behavior should this request change?
      description: Choose the closest match. Select "I am not sure" if you cannot tell whether BotHider or CS2 controls it.
      options:
        - BotHider plugin behavior
        - Built-in CS2 bot behavior
        - I am not sure
    validations:
      required: true

  - type: checkboxes
    id: request-scope
    attributes:
      label: Request scope
      options:
        - label: This issue contains one feature request only.
          required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Add examples, screenshots, or links that help explain the request.
    validations:
      required: false
